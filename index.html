<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartLib - Automated Library System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Theme tokens ===== */
:root{--p:#2563EB;--s:#4F46E5;--a:#06B6D4;--ok:#16A34A;--wa:#F59E0B;--er:#DC2626;--bg:#F8FAFC;--card:#fff;--tx:#0F172A;--mu:#64748B;--bd:#E2E8F0;--sh:0 4px 14px rgba(15,23,42,.07);--r:14px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#0B1220;--card:#131C31;--tx:#E6EDF8;--mu:#93A3BD;--bd:#243250;--sh:0 4px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.2}:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.wrap{max-width:1200px;margin:auto;padding:0 20px}.sec{padding:56px 0}.mu{color:var(--mu)}
/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}.btn.p{background:var(--p);border-color:var(--p);color:#fff}.btn.d{background:var(--er);border-color:var(--er);color:#fff}.btn.sm{padding:5px 10px;font-size:.82rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:700}.bd.g{background:#DCFCE7;color:#166534}.bd.o{background:#FEF3C7;color:#92400E}.bd.r{background:#FEE2E2;color:#991B1B}.bd.b{background:#DBEAFE;color:#1E40AF}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}label{font-weight:600;font-size:.88rem;display:block;margin:12px 0 4px}.err{color:var(--er);font-size:.8rem;min-height:1em}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:.9rem}th{color:var(--mu);font-weight:600}
.cov{height:150px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;padding:10px;font-weight:700;font-size:.85rem;background:linear-gradient(135deg,hsl(var(--h) 70% 45%),hsl(calc(var(--h) + 40) 70% 35%))}.cov i{font-size:2rem;opacity:.85}.cov.lg{height:340px;font-size:1.1rem}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}.nav .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800}.logo i{background:var(--p);color:#fff;padding:9px;border-radius:10px}.logo small{display:block;font-size:.65rem;color:var(--mu);font-weight:500}
.links{display:flex;gap:6px;margin:0 auto}.links a{padding:8px 12px;border-radius:8px;font-weight:600;font-size:.92rem}.links a:hover,.links a.on{background:var(--bd)}.nr{display:flex;gap:8px;align-items:center}.burger{display:none}
/* hero */
.hero{background:linear-gradient(135deg,#0F172A,#1E3A8A 60%,#4F46E5);color:#fff;padding:70px 0}.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}.hero h1{font-size:clamp(2rem,5vw,3.4rem)}.hero p{margin:16px 0 26px;color:#CBD5E1;max-width:50ch}
.mock{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:18px;animation:fl 5s ease-in-out infinite}.mock .row{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.12);border-radius:10px;padding:10px;margin-top:10px}@keyframes fl{50%{transform:translateY(-10px)}}
.stat b{font-size:2rem;display:block}.step{position:relative}.step .n{position:absolute;top:-12px;left:16px;background:var(--p);color:#fff;border-radius:99px;width:28px;height:28px;display:grid;place-items:center;font-weight:700}.ic{font-size:1.6rem;color:var(--p);margin-bottom:8px}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}.side{background:var(--card);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:4px}.side a{padding:10px 12px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:center}.side a:hover,.side a.on{background:var(--p);color:#fff}.main{padding:24px;min-width:0}.main h2{margin-bottom:16px}
.bar{background:var(--bd);border-radius:99px;height:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}.chart{display:flex;align-items:flex-end;gap:12px;height:160px}.chart div{flex:1;text-align:center;font-size:.75rem}.chart span{display:block;background:linear-gradient(var(--a),var(--p));border-radius:6px 6px 0 0}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.shelf div{padding:12px;border-radius:10px;border:1px solid var(--bd);text-align:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.filters>*{flex:1;min-width:140px}
/* modal toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.6);display:grid;place-items:center;z-index:100;padding:16px;animation:fi .2s}.md{background:var(--card);border-radius:var(--r);padding:24px;max-width:460px;width:100%;animation:up .25s}.md h3{margin-bottom:12px}.md .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:grid;gap:8px}.toast{background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:10px;border-left:5px solid var(--p);animation:up .25s}.toast.success{border-color:var(--ok)}.toast.error{border-color:var(--er)}.toast.warning{border-color:var(--wa)}
@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(14px)}}.ok-ic{font-size:3rem;color:var(--ok);animation:pop .4s}@keyframes pop{from{transform:scale(0)}}
.sk{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--bd) 25%,var(--card) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}.empty i{font-size:2.4rem;margin-bottom:10px}.fav.on{color:var(--er)}
footer{background:#0F172A;color:#CBD5E1;padding:36px 0;margin-top:30px}footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px}footer a{display:block;padding:2px 0}footer a:hover{color:#fff}
@media(max-width:860px){.links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--card);padding:10px;border-bottom:1px solid var(--bd)}.links.open{display:flex}.burger{display:inline-flex;margin-left:auto}.nr .hide{display:none}.hero .wrap,.shell,footer .wrap{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}.side a{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><div id="toasts" aria-live="polite"></div>
<script>
/* ===== Data layer: each key maps 1:1 to a future DB table / REST resource ===== */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const day=86400000,fmt=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),rid=n=>Math.floor(Math.random()*9*10**(n-1)+10**(n-1));
const BK=[["B101","Data Structures Using C++","Reema Thareja","9780199467556","Computer Science",2021,"English",5,3,"A-12",4.5,"Arrays, linked lists, trees and graphs with C++ implementations."],["B102","Artificial Intelligence: A Modern Approach","Stuart Russell","9780134610993","Artificial Intelligence",2020,"English",4,0,"A-14",4.8,"The standard textbook on agents, search, learning and reasoning."],["B103","Hands-On Machine Learning","Aurelien Geron","9781098125974","Data Science",2022,"English",6,4,"B-03",4.7,"Practical ML with Scikit-Learn, Keras and TensorFlow."],["B104","Python for Data Analysis","Wes McKinney","9781491957660","Data Science",2017,"English",3,1,"B-05",4.4,"Data wrangling with pandas, NumPy and Jupyter."],["B105","Higher Engineering Mathematics","B.S. Grewal","9788174091352","Mathematics",2018,"English",8,6,"C-01",4.2,"Calculus, linear algebra and differential equations for engineers."],["B106","Concepts of Physics Vol. 1","H.C. Verma","9788177091878","Physics",2019,"English",6,2,"C-09",4.9,"Mechanics, waves and thermodynamics with problem sets."],["B107","Fundamentals of Electric Circuits","Charles Alexander","9780078028229","Electronics",2016,"English",5,5,"D-02",4.3,"Circuit laws, theorems and AC/DC analysis."],["B108","Microelectronic Circuits","Adel Sedra","9780199339136","Electronics",2015,"English",4,1,"D-04",4.1,"Diodes, transistors and amplifier design."],["B109","Principles of Management","Koontz & Weihrich","9780070083462","Management",2014,"English",5,4,"E-07",3.9,"Planning, organising and leading in modern organisations."],["B110","Business Statistics","S.P. Gupta","9788180547768","Business",2013,"English",4,0,"E-10",3.8,"Statistical methods for business decisions."],["B111","The Discovery of India","Jawaharlal Nehru","9780143031031","History",2004,"English",3,2,"F-02",4.4,"A reflection on India's history and culture."],["B112","Wings of Fire","A.P.J. Abdul Kalam","9788173711466","Fiction",1999,"English",7,5,"F-11",4.8,"An autobiography of the Missile Man of India."],["B113","Operating System Concepts","Silberschatz","9781119800361","Computer Science",2021,"English",5,3,"A-16",4.5,"Processes, memory, file systems and security."],["B114","Deep Learning","Ian Goodfellow","9780262035613","Artificial Intelligence",2016,"English",3,1,"A-15",4.6,"Neural networks, optimisation and generative models."]].map(a=>({id:a[0],title:a[1],author:a[2],isbn:a[3],category:a[4],year:a[5],language:a[6],total:a[7],avail:a[8],shelf:a[9],rating:a[10],description:a[11],publisher:"Academic Press"}));
const names=["Aarav Sharma","Admin Librarian","Priya Patil","Rohan Deshmukh","Sneha Kulkarni","Vikram Joshi","Neha Gaikwad","Arjun Pawar","Isha More","Karan Shinde"];
const US=names.map((n,i)=>({id:"u"+(i+1),name:n,email:i==0?"student@smartlib.demo":i==1?"admin@smartlib.demo":n.split(" ")[0].toLowerCase()+"@smartlib.demo",student_id:i==1?"STAFF-01":"SU2026"+(100+i),department:["CSE-AIML","Admin","Electronics","Mechanical","CSE","IT","Civil","Electrical","CSE-AIML","IT"][i],year:i%4+1,password:i==1?"admin123":"demo123",role:i==1?"ADMIN":"USER",status:"Active"}));
const now=Date.now(),iso=o=>new Date(now+o*day).toISOString();
const seed={books:BK,users:US,
co:[{id:"TXN-784521",u:"u1",b:"B101",date:iso(-12),due:iso(2),ret:null},{id:"TXN-784522",u:"u1",b:"B103",date:iso(-4),due:iso(10),ret:null},{id:"TXN-784100",u:"u1",b:"B105",date:iso(-40),due:iso(-26),ret:iso(-28)},{id:"TXN-784600",u:"u3",b:"B102",date:iso(-20),due:iso(-6),ret:null}],
res:[{id:"RES-2026-10482",u:"u1",b:"B102",date:iso(-1),pos:2,status:"Waiting"},{id:"RES-2026-10483",u:"u4",b:"B110",date:iso(-2),pos:1,status:"Waiting"}],
fav:{u1:["B102","B103"]},notes:[{id:1,u:"u1",type:"due",msg:"Your book 'Data Structures Using C++' is due in 2 days.",at:iso(0),read:false},{id:2,u:"u1",type:"res",msg:"Your reservation position changed to 2.",at:iso(-1),read:false}],
cfg:{max:5,days:14,renew:2,hold:3,name:"SmartLib Central Library"}};
const S={};Object.keys(seed).forEach(k=>S[k]=load(k,seed[k]));if(!localStorage.books)Object.keys(seed).forEach(k=>save(k,seed[k]));
const sv=()=>Object.keys(seed).forEach(k=>save(k,S[k]));
const me=()=>S.users.find(u=>u.id==load("session",null)),bk=id=>S.books.find(b=>b.id==id)||{title:"?",author:""},usr=id=>S.users.find(u=>u.id==id)||{name:"?"};
const status=c=>c.ret?"Returned":new Date(c.due)<now?"Overdue":new Date(c.due)-now<=2*day?"Due Soon":"Active";
const sb=s=>`<span class="bd ${{Active:"g",Returned:"b","Due Soon":"o",Overdue:"r",Waiting:"o","Ready for Pickup":"g",Completed:"b",Cancelled:"r",Suspended:"r"}[s]||"b"}">${s}</span>`;
const avb=b=>b.avail<1?'<span class="bd r">Currently Borrowed</span>':b.avail<=1?'<span class="bd o">Few Copies</span>':'<span class="bd g">Available</span>';
const cover=(b,c="")=>`<div class="cov ${c}" style="--h:${(+b.id.slice(1)*47)%360}" role="img" aria-label="Cover of ${b.title}"><i class="fa-solid fa-book-open"></i>${b.title}</div>`;
const notify=(u,type,msg)=>{S.notes.unshift({id:Date.now()+rid(3),u,type,msg,at:new Date().toISOString(),read:false})};
/* ===== UI helpers ===== */
function toast(m,t="info"){const e=document.createElement("div");e.className="toast "+t;e.textContent=m;$("#toasts").append(e);setTimeout(()=>e.remove(),3200)}
function modal(h){closeM();const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="md" role="dialog" aria-modal="true">${h}</div>`;o.onclick=e=>{if(e.target==o)closeM()};document.body.append(o);$("button,input",o)?.focus()}
const closeM=()=>$$(".ov").forEach(o=>o.remove());document.addEventListener("keydown",e=>e.key=="Escape"&&closeM());
const go=h=>{location.hash=h},empty=(i,t,b)=>`<div class="empty"><i class="fa-solid ${i}"></i><p>${t}</p>${b?`<br><a class="btn p" href="${b[1]}">${b[0]}</a>`:""}</div>`;
const tbl=(h,r)=>`<div class="tw card"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.join("")}</tbody></table></div>`;
const bookCard=b=>`<div class="card">${cover(b)}<h3 style="margin:10px 0 2px;font-size:1rem">${b.title}</h3><div class="mu">${b.author}</div><div class="mu" style="font-size:.8rem">${b.category} | ISBN ${b.isbn}</div><div style="margin:8px 0"><i class="fa-solid fa-star" style="color:var(--wa)"></i> ${b.rating} ${avb(b)}</div><div style="display:flex;gap:6px"><a class="btn sm" href="#/book/${b.id}">View details</a><button class="btn sm p" data-act="${b.avail?"checkout":"reserve"}" data-id="${b.id}">${b.avail?"Checkout":"Reserve"}</button></div></div>`;
/* ===== Layouts ===== */
function nav(){const u=me(),r=location.hash;const l=[["Home","#/"],["Browse Books","#/books"],["Reservations","#/dash/reservations"],["About","#/about"],["Help","#/help"]];
return `<header class="nav"><div class="wrap"><a class="logo" href="#/"><i class="fa-solid fa-book-open-reader"></i><span>SmartLib<small>Automated Library System</small></span></a><nav class="links" id="lk" aria-label="Main">${l.map(x=>`<a href="${x[1]}" class="${r==x[1]?"on":""}">${x[0]}</a>`).join("")}</nav><div class="nr"><button class="btn sm" data-act="theme" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>${u?`<a class="btn sm hide" href="#/${u.role=="ADMIN"?"admin":"dash"}/overview"><i class="fa-solid fa-gauge"></i> ${u.name.split(" ")[0]}</a><button class="btn sm" data-act="logout">Logout</button>`:`<a class="btn sm hide" href="#/login">Login</a><a class="btn sm p hide" href="#/register">Register</a>`}<button class="btn sm burger" data-act="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button></div></div></header>`}
const foot=()=>`<footer><div class="wrap"><div><h3>SmartLib</h3><p>Making library access smarter, faster and easier.</p></div><div><b>Quick links</b><a href="#/">Home</a><a href="#/books">Browse Books</a><a href="#/about">About</a><a href="#/help">Contact</a></div><div><b>Library</b><a href="#/dash/checkout">Checkout</a><a href="#/dash/reservations">Reservations</a><a href="#/help">Help</a></div><div><b>Account</b><a href="#/login">Login</a><a href="#/register">Register</a><a href="#/dash/overview">Dashboard</a></div></div><p class="wrap" style="margin-top:20px;font-size:.85rem">&copy; 2026 SmartLib - Automated Library Book Checkout &amp; Reservation System. Designed for Smart Campus Libraries.</p></footer>`;
function shell(kind,items,body){const cur=location.hash.split("/")[2]||"overview";return `${nav()}<div class="shell"><aside class="side" aria-label="${kind} menu">${items.map(i=>`<a href="#/${kind}/${i[0]}" class="${cur==i[0]?"on":""}"><i class="fa-solid ${i[2]}"></i>${i[1]}</a>`).join("")}</aside><main class="main">${body}</main></div>`}
const UM=[["overview","Dashboard","fa-gauge"],["mybooks","My Books","fa-book"],["checkout","Checkout / Return","fa-qrcode"],["reservations","Reservations","fa-bookmark"],["favorites","Favorites","fa-heart"],["history","History","fa-clock-rotate-left"],["notifications","Notifications","fa-bell"],["profile","Profile","fa-user"],["settings","Settings","fa-gear"]];
const AM=[["overview","Dashboard","fa-gauge"],["books","Books","fa-book"],["users","Users","fa-users"],["checkouts","Checkouts","fa-arrow-right-arrow-left"],["reservations","Reservations","fa-bookmark"],["inventory","Inventory","fa-warehouse"],["reports","Reports","fa-chart-line"],["settings","Settings","fa-gear"]];
/* ===== Public views ===== */
const V={};
V.home=()=>`${nav()}<section class="hero"><div class="wrap"><div><h1>Your Smart Library, Simplified.</h1><p>Discover, reserve, and check out books effortlessly with an intelligent automated library system.</p><a class="btn p" href="#/books">Browse Books</a> <a class="btn" href="#how" data-act="how">Explore How It Works</a></div><div class="mock" aria-hidden="true"><b><i class="fa-solid fa-magnifying-glass"></i> Search: "machine learning"</b><div class="row"><i class="fa-solid fa-book"></i> Hands-On Machine Learning <span class="bd g" style="margin-left:auto">Available</span></div><div class="row"><i class="fa-solid fa-bookmark"></i> Reservation RES-2026-10482</div><div class="row"><i class="fa-solid fa-qrcode"></i> Scan QR - Checkout in 3 seconds</div></div></div></section>
<section class="wrap sec"><div class="grid g4">${[["Books",10000],["Registered Users",5000],["Availability Accuracy %",98],["Digital Access (hrs/day)",24]].map(s=>`<div class="card stat"><b data-count="${s[1]}">0</b>${s[0]}</div>`).join("")}</div></section>
<section class="wrap" id="how"><h2>How it works</h2><br><div class="grid g4">${[["Search","fa-magnifying-glass","Find the book you need using smart search and filters."],["Reserve","fa-bookmark","Reserve unavailable books and receive notifications."],["Checkout","fa-qrcode","Check out available books quickly through the automated system."],["Return","fa-rotate-left","Return books and automatically update your borrowing record."]].map((s,i)=>`<div class="card step"><span class="n">${i+1}</span><div class="ic"><i class="fa-solid ${s[1]}"></i></div><h3>${s[0]}</h3><p class="mu">${s[2]}</p></div>`).join("")}</div></section>
<section class="wrap sec"><h2>Features</h2><br><div class="grid">${[["Smart Book Search","fa-magnifying-glass","Search thousands of books instantly."],["Automated Checkout","fa-robot","Reduce manual library processing."],["Book Reservation","fa-bookmark","Reserve unavailable books."],["Real-Time Availability","fa-signal","Know whether a book is available."],["Notifications","fa-bell","Receive due-date and reservation alerts."],["Borrowing History","fa-clock-rotate-left","Track previously borrowed books."],["QR / Barcode Support","fa-qrcode","Enable faster identification of books."],["Admin Analytics","fa-chart-pie","Monitor library activity and inventory."]].map(f=>`<div class="card"><div class="ic"><i class="fa-solid ${f[1]}"></i></div><h3>${f[0]}</h3><p class="mu">${f[2]}</p></div>`).join("")}</div></section>${foot()}`;
let Q={q:"",cat:"",av:"",sort:"rel"};
V.books=()=>{const cats=[...new Set(S.books.map(b=>b.category))];return `${nav()}<div class="wrap sec"><h1>Explore Our Collection</h1><div class="filters"><input id="q" placeholder="Search by title, author, ISBN..." value="${Q.q}" aria-label="Search books" style="flex:3"><select id="cat" aria-label="Category"><option value="">All categories</option>${cats.map(c=>`<option ${Q.cat==c?"selected":""}>${c}</option>`).join("")}</select><select id="av" aria-label="Availability"><option value="">Any availability</option><option value="1" ${Q.av?"selected":""}>Available now</option></select><select id="sort" aria-label="Sort"><option value="rel">Relevance</option><option value="new" ${Q.sort=="new"?"selected":""}>Newest</option><option value="rate" ${Q.sort=="rate"?"selected":""}>Highest rated</option><option value="az" ${Q.sort=="az"?"selected":""}>Title A-Z</option></select></div><div id="list" class="grid"></div></div>${foot()}`};
function list(){const q=Q.q.toLowerCase();let r=S.books.filter(b=>(!q||[b.title,b.author,b.category,b.isbn].some(x=>x.toLowerCase().includes(q)))&&(!Q.cat||b.category==Q.cat)&&(!Q.av||b.avail>0));

dodel(d){S.books=S.books.filter(b=>b.id!=d.id);sv();closeM();toast("Book deleted.","info");render()},
suspend(d){const u=S.users.find(x=>x.id==d.id);u.status=u.status=="Active"?"Suspended":"Active";sv();render()},deluser(d){S.users=S.users.filter(x=>x.id!=d.id);sv();toast("User deleted.","info");render()},
setres(d){S.res.find(r=>r.id==d.id).status=d.s;sv();render()},
export(d){const rows=[["Transaction","User","Book","Due"],...S.co.map(c=>[c.id,usr(c.u).name,bk(c.b).title,fmt(c.due)])];const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(x=>'"'+x+'"').join(",")).join("\n")],{type:"text/csv"}));a.download=d.r.replace(/\s+/g,"_")+".csv";a.click();toast("Report exported.","success")}};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&A_[el.dataset.act]){if(el.tagName=="A"&&el.dataset.act!="how")return;if(el.dataset.act=="how")e.preventDefault();A_[el.dataset.act](el.dataset)}});
document.addEventListener("input",e=>{const i=e.target.id;if(i=="q"){Q.q=e.target.value;list()}else if(["cat","av","sort"].includes(i)){Q[i]=e.target.value;list()}else if(i=="hf"||i=="hq")hist()});
document.addEventListener("change",e=>{if(["cat","av","sort"].includes(e.target.id)){Q[e.target.id]=e.target.value;list()}});
/* ===== Forms (validation + submit) ===== */
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(f)),t=f.dataset.form;
const bad=(n,m)=>{const el=f.elements[n];(el.closest("label")?.nextElementSibling||el.nextElementSibling).textContent=m;return 1};$$(".err",f).forEach(x=>x.textContent="");
if(t=="login"){let x=0;if(!d.id)x=bad("id","Enter your email or student ID.");if(!d.pw)x=bad("pw","Enter your password.");if(x)return;const btn=$("button",f);btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Signing in';setTimeout(()=>{const u=S.users.find(u=>(u.email==d.id||u.student_id==d.id)&&u.password==d.pw);if(!u){btn.textContent="Sign in";return bad("pw","Incorrect ID or password.")}if(u.status!="Active"){btn.textContent="Sign in";return bad("pw","This account is suspended.")}save("session",u.id);toast("Welcome back, "+u.name.split(" ")[0]+".","success");go(u.role=="ADMIN"?"/admin/overview":"/dash/overview")},600)}
if(t=="register"){let x=0;["name","sid","email","phone","dept","year","pw"].forEach(n=>{if(!d[n]?.trim())x=bad(n,"This field is required.")});if(d.email&&!/^\S+@\S+\.\S+$/.test(d.email))x=bad("email","Enter a valid email.");if(d.pw&&d.pw.length<6)x=bad("pw","Use at least 6 characters.");if(d.pw!=d.pw2)x=bad("pw2","Passwords do not match.");if(!d.tc)f.elements.tc.closest("label").nextElementSibling.textContent="Accept the terms to continue.",x=1;if(x)return;if(S.users.some(u=>u.email==d.email))return bad("email","Email already registered.");const u={id:"u"+(S.users.length+1+rid(2)),name:d.name,email:d.email,student_id:d.sid,department:d.dept,year:+d.year,password:d.pw,role:"USER",status:"Active"};S.users.push(u);sv();save("session",u.id);toast("Account created.","success");go("/dash/overview")}
if(t=="forgot"){toast("If that email exists, a reset link was sent (demo).","info");go("/login")}
if(t=="book"){let x=0;["title","author","isbn","category","total","shelf"].forEach(n=>{if(!d[n]?.trim())x=bad(n,"Required.")});if(d.total&&!(+d.total>0))x=bad("total","Enter a number above 0.");if(x)return;const id=f.dataset.id;if(id){const b=S.books.find(b=>b.id==id);const diff=+d.total-b.total;Object.assign(b,d,{year:+d.year||b.year,total:+d.total,avail:Math.max(0,b.avail+diff)})}else S.books.push({...d,id:"B"+(100+S.books.length+1+rid(1)),year:+d.year||2026,total:+d.total,avail:+d.total,rating:4});sv();toast(id?"Book updated.":"Book added.","success");go("/admin/books")}
if(t=="cfg"){["max","days","renew","hold"].forEach(n=>S.cfg[n]=+d[n]);S.cfg.name=d.name;sv();toast("Settings saved.","success")}});
/* ===== Boot ===== */
document.documentElement.dataset.theme=load("theme","light");render();
</script></body></html>
